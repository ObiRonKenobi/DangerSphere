services:
  dangersphere:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dangersphere
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend:ro
    env_file:
      - .env
    environment:
      - CACHE_PATH=/app/data/live_disasters.json.gz
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
